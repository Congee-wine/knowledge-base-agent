services:
  redis:
    image: redis:7.4.2-alpine
    container_name: knowledge-base-agent-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: knowledge-base-agent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: knowledge-base-agent-worker
    command: python -m workers.runner
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
      OBJECT_STORAGE_BUCKET: ai-platform-private
      OBJECT_STORAGE_SECURE: "false"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend:/app
    restart: unless-stopped

volumes:
  redis-data:
  minio-data:
